name: Desktop app

# Packaging is expensive: tags v* and manual dispatch only (no PR builds).
# Pushing a tag vX.Y.Z creates a DRAFT pre-release with installers; nothing becomes
# public until the draft is published by hand. The installers are not signed yet.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify candidate
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifacts: |
              desktop/dist/*.exe
          - name: macOS (Apple Silicon)
            os: macos-latest
            artifacts: |
              desktop/dist/*.dmg
              desktop/dist/*.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Unit tests
        run: npm test
        working-directory: desktop
      - name: Build installer
        run: npm run dist
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: openfabric-studio-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the desktop version
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match desktop/package.json version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Write checksums and release notes
        run: |
          cd installers
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > ../notes.md <<'NOTES'
          Experimental OpenFabric Studio installers for Windows (NVIDIA GPU) and macOS (Apple Silicon).

          - They are not signed yet. Windows shows a SmartScreen warning and macOS may ask you to allow the app.
          - First launch downloads the baseline music engines and models into a folder you choose. Voice and generated-video engines require their separately documented setup.
          - SHA-256 sums of every file are in `SHA256SUMS.txt`.
          - Derived from Remiqora under MIT — see NOTICE in the repository.

          Setup instructions, verified environments and known limits belong in the README and reviewed release notes. A successful package build alone does not verify installation or GPU inference.
          NOTES
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
            if [ "$draft" != "true" ]; then
              echo "Refusing to overwrite assets of published release $GITHUB_REF_NAME" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* --draft --prerelease \
              --title "OpenFabric Studio ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
