name: CI

# Lean triggers: PRs to main/master + pushes to main/master only (not every branch).
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows native ownership tests: manual / workflow_call only (saves minutes on every PR).
  native-process-windows:
    name: Windows native process ownership
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install python-dotenv httpx pydantic
      - name: Verify real Windows job termination and parent death
        run: python -m unittest app.windows_native_test -v
        working-directory: backend
        env:
          OPENFABRIC_CONFIG: ${{ runner.temp }}/openfabric-native/config.json
          OPENFABRIC_DATA_DIR: ${{ runner.temp }}/openfabric-native/library
          SEED_VC_DIR: ${{ runner.temp }}/openfabric-native/engine

  backend-runtime:
    name: Base runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install hashed base wheels
        run: |
          python -m pip install --require-hashes --only-binary :all: -r backend/requirements.lock
      - run: python -m pip check
      - name: Verify lightweight runtime imports
        run: python -I -c "import fastapi, uvicorn, httpx, pydantic, multipart, dotenv, numpy, PIL"

  desktop:
    name: Desktop (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Unit tests do not launch Electron; avoid its binary download here.
      - run: npm ci --ignore-scripts
      - run: npm test

  frontend:
    name: Frontend (types, behavioral tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (regressions and contract drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Isolate test configuration, library and engine
        run: |
          printf '%s\n' \
            "OPENFABRIC_CONFIG=$RUNNER_TEMP/openfabric-test-config.json" \
            "OPENFABRIC_DATA_DIR=$RUNNER_TEMP/openfabric-test-library" \
            "SEED_VC_DIR=$RUNNER_TEMP/openfabric-test-seed-vc" \
            "OPENFABRIC_MODULE_ROOT=$RUNNER_TEMP/openfabric-test-modules" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r backend/requirements-test.txt
      - run: python backend/scripts/generate_contracts.py --check
      - name: Strict Python types (Linux, macOS, Windows paths)
        run: |
          for target in linux darwin win32; do
            python -m mypy --strict --follow-imports=silent app/music_terms_contracts.py app/music_terms.py app/api/routes_music_terms.py --platform "$target"
            python -m mypy --strict --follow-imports=silent app/song_from_beat_contracts.py app/song_capabilities.py app/song_from_beat.py app/api/routes_song_from_beat.py scripts/ace_conditioning_server.py --platform "$target"
            python -m mypy --strict --follow-imports=silent app/music_beats.py app/music_beats_runtime.py scripts/music_beats_worker.py --platform "$target"
            python -m mypy --strict --follow-imports=silent app/music_analysis_contracts.py app/music_analysis_features.py app/music_analysis.py app/api/routes_music_analysis.py scripts/music_analysis_worker.py --platform "$target"
            python -m mypy --strict --follow-imports=silent app/music_artifact_contracts.py app/music_artifacts.py app/api/routes_music_artifacts.py app/music_dsp_contracts.py app/music_dsp.py app/music_alignment.py app/music_stretch.py app/music_dsp_runtime.py --platform "$target"
            python -m mypy --strict --follow-imports=silent app/beat_project_contracts.py app/beat_projects.py app/beat_preset_contracts.py app/beat_presets.py --platform "$target"
            python -m mypy --strict --follow-imports=silent app/music_conditioning_contracts.py app/music_conditioning.py app/api/routes_music_conditioning.py app/local_music_contracts.py app/local_music_runtime.py app/local_music.py app/api/routes_local_music.py scripts/local_music_worker.py --platform "$target"
            python -m mypy --strict --follow-imports=silent app/beat_contracts.py app/beat_compile.py app/beat_midi.py app/beat_store.py app/beat_render.py app/beat_jobs.py app/api/routes_beats.py app/beat_preset_contracts.py app/beat_presets.py --platform "$target"
            python -m mypy --strict --follow-imports=silent app/voice_mix_contracts.py app/voice_mix.py --platform "$target"
            python -m mypy --strict --follow-imports=silent app/replacement_contracts.py app/replacement_store.py app/replacement_jobs.py app/replacement_mix.py app/replacement_diagnostics_contracts.py app/replacement_diagnostics.py app/replacement_diagnostics_runtime.py app/replacement_pitch_contracts.py app/replacement_pitch.py scripts/replacement_pitch_worker.py app/replacement_tonal_contracts.py app/replacement_tonal.py scripts/replacement_tonal_worker.py app/rvc_models.py app/voice_conversion.py app/api/routes_replacement.py --platform "$target"
