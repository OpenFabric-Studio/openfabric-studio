name: CI

# Lean triggers: PRs to main/master + pushes to main/master only (not every branch).
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows native ownership tests: manual / workflow_call only (saves minutes on every PR).
  native-process-windows:
    name: Windows native process ownership
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install python-dotenv httpx pydantic
      - name: Verify real Windows job termination and parent death
        run: python -m unittest app.windows_native_test -v
        working-directory: backend
        env:
          OPENFABRIC_CONFIG: ${{ runner.temp }}/openfabric-native/config.json
          OPENFABRIC_DATA_DIR: ${{ runner.temp }}/openfabric-native/library
          SEED_VC_DIR: ${{ runner.temp }}/openfabric-native/engine

  backend-runtime:
    name: Base runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install hashed base wheels
        run: |
          python -m pip install --require-hashes --only-binary :all: -r backend/requirements.lock
      - run: python -m pip check
      - name: Verify lightweight runtime imports
        run: python -I -c "import fastapi, uvicorn, httpx, pydantic, multipart, dotenv, numpy, PIL"

  desktop:
    name: Desktop (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Unit tests do not launch Electron; avoid its binary download here.
      - run: npm ci --ignore-scripts
      - run: npm test

  frontend:
    name: Frontend (types, behavioral tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (regressions and contract drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Isolate test configuration, library and engine
        run: |
          printf '%s\n' \
            "OPENFABRIC_CONFIG=$RUNNER_TEMP/openfabric-test-config.json" \
            "OPENFABRIC_DATA_DIR=$RUNNER_TEMP/openfabric-test-library" \
            "SEED_VC_DIR=$RUNNER_TEMP/openfabric-test-seed-vc" \
            "OPENFABRIC_MODULE_ROOT=$RUNNER_TEMP/openfabric-test-modules" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r backend/requirements-test.txt
      - run: python backend/scripts/generate_contracts.py --check
      - name: Strict Python types (Linux, macOS, Windows paths)
        run: |
          for target in linux darwin win32; do
            python -m mypy --strict --follow-imports=silent app/managed_layout.py app/audiobook_cache.py app/audiobook_cast.py app/audiobook_workflows.py app/audiobook_review.py app/audiobook_review_contracts.py app/api/routes_audiobook_review.py app/speech_references.py app/narration_pauses.py app/video_dialogue.py app/video_character_comparison.py app/video_training_review.py app/video_benchmark.py scripts/benchmark_video.py app/video_candidate.py app/module_licenses.py app/speaker_review.py app/speaker_review_contracts.py app/speaker_review_worker.py app/speaker_review_environment.py app/api/routes_speaker_review.py scripts/speaker_review.py scripts/setup_speaker_review.py app/audio_quality.py app/audio_quality_contracts.py app/export_provenance.py app/export_provenance_contracts.py app/audiobook_contracts.py app/audiobooks.py app/audiobook_narration.py app/audiobook_pronounce.py app/audiobook_publish.py app/ebook_import.py app/ebook_import_worker.py app/speech_clone.py app/api/routes_audiobooks.py app/module_evidence.py app/module_runtime.py app/module_contracts.py app/module_catalog.py app/module_jobs.py app/module_install.py app/module_security.py app/api/routes_modules.py app/contracts.py app/client_contracts.py app/generation_contracts.py app/generation_library.py app/api/routes_generation_library.py app/yue_contracts.py app/yue_jobs.py app/api/routes_yue_jobs.py app/api/routes_stem_exports.py app/native_yue.py app/native_artifacts.py app/main.py app/config.py app/orchestrator/state.py app/orchestrator/manager.py app/orchestrator/process.py app/orchestrator/windows_job.py app/orchestrator/windows_supervisor.py app/orchestrator/posix_supervisor.py app/api/routes_proxy.py app/api/routes_ace_jobs.py app/reference_melody.py app/reference_contracts.py app/reference_imports.py app/reference_tools.py app/api/routes_references.py app/atomic_files.py app/data_root.py app/ace_jobs.py app/audio_version_contracts.py app/audio_version_store.py app/audio_versions.py app/audio_encoding.py app/audio_exports.py app/artist_settings.py app/tagging.py app/tagging_genres.py app/track_activity.py app/api/tagged_download_response.py app/api/routes_audio_versions.py app/api/routes_audio_exports.py app/api/routes_audio_settings.py app/job_lifecycle.py app/resource_admission.py app/track_view.py app/voice_contracts.py app/voice_profile_contracts.py app/voice_profiles.py app/speech_starter_voices.py app/api/routes_voice_profiles.py app/api/routes_speech_clone.py app/voice_progress.py app/gpu_lease.py app/voice_apply_progress.py app/voice_comparisons.py app/voice_separation.py app/voice_artifacts.py app/voice_preparation.py app/voice_coverage.py app/prep_vocal.py app/clean_vocal.py app/seed_vc_compat.py app/voice_measure.py app/voice_download.py app/voice_replacement.py app/video_contracts.py app/video_projects.py app/video_characters.py app/video_character_training.py app/optional_engine_contracts.py app/optional_engines.py app/api/routes_optional_engines.py app/audiobook_collection.py app/audiobook_cue.py app/desktop_runtime.py app/yue_upload.py app/api/routes_yue2_upload.py app/video_media.py app/video_process.py app/video_render.py app/video_text.py app/video_io.py app/video_engine.py app/video_analysis.py app/api/routes_voice_trials.py scripts/generate_contracts.py scripts/setup_modules.py scripts/setup_yue_native.py scripts/setup_roformer.py scripts/setup_video.py scripts/run_video.py app/cloud_music.py app/cloud_music_contracts.py app/api/routes_cloud_music.py app/cloud_speech.py app/audiobook_cloud.py app/openrouter_contracts.py app/openrouter_credentials.py app/openrouter_errors.py app/openrouter_settings.py app/openrouter_catalog.py app/openrouter_requests.py app/openrouter_client.py app/api/routes_openrouter.py app/video_cloud.py app/video_cloud_media.py app/api/routes_videos.py --platform "$target"
          done
        working-directory: backend
      - run: python -m unittest discover -s app -p '*_test.py' -v
        working-directory: backend
