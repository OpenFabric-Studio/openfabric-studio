            python -m mypy --strict --follow-imports=silent app/artist_contracts.py app/artists.py app/artist_production_contracts.py app/artist_production.py app/production_render.py app/voice_authorization.py app/api/routes_artist_production.py app/api/routes_voices.py app/recording_contracts.py app/recording_sessions.py app/singer_range_contracts.py app/singer_ranges.py app/guide_range.py app/voice_retention_contracts.py app/voice_retention.py app/royalty_contracts.py app/royalty_accounting.py --platform "$target"
            python -m mypy --strict --follow-imports=silent app/character_swap_contracts.py app/character_swaps.py app/api/routes_character_swaps.py app/video_scene_contracts.py app/video_scenes.py app/api/routes_video_scenes.py app/clip_host_contracts.py app/clip_host_settings.py app/clip_hosting.py app/api/routes_clip_host.py --platform "$target"
            python -m mypy --strict --follow-imports=silent app/managed_layout.py app/audiobook_cache.py app/audiobook_cast.py app/audiobook_workflows.py app/audiobook_review.py app/audiobook_review_contracts.py app/api/routes_audiobook_review.py app/speech_references.py app/narration_pauses.py app/video_dialogue.py app/video_character_comparison.py app/video_training_review.py app/video_benchmark.py scripts/benchmark_video.py app/video_candidate.py app/image_normalization.py app/narration_duration.py app/reading_media_contracts.py app/reading_media.py app/retained_audio.py app/api/routes_reading_media.py app/support_contracts.py app/support_controls.py app/support_diagnostics.py app/api/routes_support.py app/api/routes_orchestrator.py app/module_licenses.py app/speaker_review.py app/speaker_review_contracts.py app/speaker_review_worker.py app/speaker_review_environment.py app/api/routes_speaker_review.py scripts/speaker_review.py scripts/setup_speaker_review.py app/audio_quality.py app/audio_quality_contracts.py app/export_provenance.py app/export_provenance_contracts.py app/music_evidence.py app/audiobook_contracts.py app/audiobooks.py app/audiobook_narration.py app/audiobook_pronounce.py app/audiobook_publish.py app/ebook_import.py app/ebook_import_worker.py app/speech_clone.py app/api/routes_audiobooks.py app/module_evidence.py app/module_runtime.py app/module_contracts.py app/module_catalog.py app/module_jobs.py app/module_diagnostics.py app/module_install.py app/module_music_models.py app/module_native_setup.py app/module_security.py app/api/routes_modules.py app/contracts.py app/client_contracts.py app/music_score_contracts.py app/generation_contracts.py app/generation_library.py app/api/routes_generation_library.py app/yue_contracts.py app/yue_jobs.py app/api/routes_yue_jobs.py app/api/routes_stem_exports.py app/native_yue.py app/native_artifacts.py app/main.py app/config.py app/orchestrator/state.py app/orchestrator/manager.py app/orchestrator/process.py ap