            python -m mypy --strict --follow-imports=silent app/regional_dataset_contracts.py app/regional_dataset_store.py app/regional_datasets.py app/regional_acoustic_contracts.py app/regional_acoustic_helper.py scripts/regional_acoustic_worker.py app/regional_evaluation_contracts.py app/regional_evaluation.py app/api/routes_regional_datasets.py --platform "$target"
