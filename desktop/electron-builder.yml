appId: io.github.openfabric.studio
productName: OpenFabric Studio
copyright: Copyright © 2026 Nikolay Cherkashin and OpenFabric Studio contributors
directories:
  output: dist
  buildResources: build
publish: null

files:
  - src/**
  - renderer/**
  - manifest.json
  - package.json
  - "!**/*.map"

# The backend runs from real files (Python cannot import from an asar archive). Its own sibling layout is kept:
# resources/backend and resources/frontend/dist.
extraResources:
  - from: resources/backend
    to: backend
  - from: resources/frontend
    to: frontend
  - from: resources/patches
    to: patches
  - from: resources/external
    to: external

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: true            # per-user install, no administrator prompt
  perMachine: false
  deleteAppDataOnUninstall: false   # models and projects are the user's data, not ours to delete
  artifactName: OpenFabric-Studio-Setup-${version}.${ext}
  shortcutName: OpenFabric Studio

mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.music
  icon: build/icon.png
  # Ad-hoc signing (no certificate). With identity null the renamed Electron bundle had no valid seal, and a
  # downloaded copy (quarantine flag set by the browser) was reported as "damaged" with no way to open it.
  # Pattern from inikolax/remiqora v0.2.2 (bd8316e, #33, MIT). An ad-hoc seal turns that into the usual
  # "Apple could not verify" prompt, which the user passes once via System Settings > Privacy & Security >
  # Open Anyway. Hardened runtime stays off: without a Developer ID it makes library validation reject
  # Electron's frameworks. A Developer ID and notarization is the real fix.
  identity: "-"
  hardenedRuntime: false
  artifactName: OpenFabric-Studio-${version}-${arch}.${ext}

# Linux packaging is experimental; first-run setup currently reports unsupported.
linux:
  target: [AppImage]
  category: AudioVideo
  icon: build/icon.png
  artifactName: OpenFabric-Studio-${version}-${arch}.${ext}
